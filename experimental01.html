<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandas</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f2d;
    color: white;
}

/* CONTENEDOR GENERAL */
.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
}

/* RESPONSIVE: en celular solo 1 columna */
@media (max-width: 768px) {
    .container {
        grid-template-columns: 1fr;
    }
}

/* CARD */
.card {
    background: linear-gradient(145deg, #1a1a4f, #12123a);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    display: grid;
    gap: 10px;
}

/* GRID INTERNO */
.card-info {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 6px 10px;
}

/* TITULOS */
.label {
    font-weight: bold;
    color: #00bfff;
}

/* LINKS */
.card a {
    color: #7dd3fc;
    text-decoration: none;
}

.card a:hover {
    text-decoration: underline;
}

/* IFRAME RESPONSIVO */
.video {
    position: relative;
    padding-bottom: 56.25%; /* 16:9 */
    height: 0;
    overflow: hidden;
    border-radius: 8px;
}

.video iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div class="container">

    <!-- CARD 1 -->
    <div class="card">
        <div class="card-info">
            <div class="label">Banda:</div><div>Metallica</div>
            <div class="label">Álbum:</div><div>Master of Puppets</div>
            <div class="label">Año:</div><div>1986</div>
            <div class="label">País:</div><div>USA</div>
            <div class="label">Géneros:</div><div>Thrash Metal</div>
            <div class="label">Link 1:</div><div><a href="#">Wikipedia</a></div>
            <div class="label">Link 2:</div><div><a href="#">Spotify</a></div>
        </div>

        <div class="video">
            <iframe src="https://www.youtube.com/embed/E0ozmU9cJDg" 
                    frameborder="0" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- CARD 2 -->
    <div class="card">
        <div class="card-info">
            <div class="label">Banda:</div><div>Iron Maiden</div>
            <div class="label">Álbum:</div><div>The Number of the Beast</div>
            <div class="label">Año:</div><div>1982</div>
            <div class="label">País:</div><div>UK</div>
            <div class="label">Géneros:</div><div>Heavy Metal</div>
            <div class="label">Link 1:</div><div><a href="#">Wikipedia</a></div>
            <div class="label">Link 2:</div><div><a href="#">Spotify</a></div>
        </div>

        <div class="video">
            <iframe src="https://www.youtube.com/embed/WxnN05vOuSM" 
                    frameborder="0" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

</div>

</body>
</html>
